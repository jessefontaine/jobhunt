name: Bug report
description: Something in the engine does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you saw. Paste the job log or the terminal output if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Filled in for you when you come from the dashboard. Otherwise, the `jobhunt` version from "What's new", Python version and OS.
      render: text
